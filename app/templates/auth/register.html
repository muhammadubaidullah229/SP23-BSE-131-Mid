{% extends "base.html" %}

{% block title %}Register | EduCore Academic Portal{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7.5" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h1>Portal Registration</h1>
      <p>Create your university profile for course access</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form" id="registerForm">
      <div class="form-group">
        <label for="full_name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="full_name" 
          name="full_name" 
          class="form-input" 
          placeholder="e.g. Muhammad Hamza" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="reg_number" class="form-label">Registration / Roll Number</label>
        <input 
          type="text" 
          id="reg_number" 
          name="reg_number" 
          class="form-input" 
          placeholder="e.g. SP23-BSE-131" 
          required
        >
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="e.g. hamza_131" 
            required
          >
        </div>

        <div class="form-group">
          <label for="role" class="form-label">Portal Role</label>
          <select id="role" name="role" class="form-input">
            <option value="Student" selected>Student</option>
            <option value="Faculty">Faculty</option>
            <option value="Staff">Academic Staff</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">University Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="student@university.edu.pk" 
          required
        >
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Min 6 chars" 
            required
          >
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm</label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-input" 
            placeholder="Re-enter" 
            required
          >
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width: 100%; margin-top: 0.5rem;">
        Register Student Profile &rarr;
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in to Portal</a>
    </div>
  </div>
</div>
{% endblock %}
